name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: bookclub-main
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write

env:
  IMAGE_TAG: ${{ github.sha }}
  AWS_REGION: eu-west-3
  ECR_REPOSITORY: bookclub
  DJANGO_STATIC_BUCKET: sinan-bookclub-static
  VITE_API_URL: https://api.sinanerbezci.com/api

jobs:

  # --------------------------------------------------
  # Backend checks
  # --------------------------------------------------

  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./bookclub

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI dependencies
        run: |
          pip install -r requirements-ci.txt

      - name: Check Django setup
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: mysite.settings.production
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: |
          python manage.py check


  # --------------------------------------------------
  # Frontend checks
  # --------------------------------------------------

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build frontend
        run: npm run build


  # --------------------------------------------------
  # Detect changes
  # --------------------------------------------------

  changes:
    name: Detect Changes
    runs-on: ubuntu-latest

    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deployment: ${{ steps.filter.outputs.deployment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'bookclub/**'

            frontend:
              - 'frontend/**'

            deployment:
              - '.github/workflows/**'
              - 'k8s/**'


  # --------------------------------------------------
  # Deploy backend through GitOps
  # --------------------------------------------------

  deploy-backend:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend
      - changes

    if: |
      github.ref == 'refs/heads/main' &&
      (
        needs.changes.outputs.backend == 'true' ||
        needs.changes.outputs.deployment == 'true' ||
        github.event_name == 'workflow_dispatch'
      )

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------------------------
      # AWS
      # ----------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::796973519136:role/github-actions-bookclub
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ----------------------------------------------
      # Docker
      # ----------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Django image
        uses: docker/build-push-action@v6
        with:
          context: ./bookclub
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=django
          cache-to: type=gha,mode=max,scope=django

      # ----------------------------------------------
      # GitOps
      # ----------------------------------------------

      - name: Install yq
        uses: mikefarah/yq@v4.47.1

      - name: Update Kubernetes image tag
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          yq -i '
            (.images[] | select(.name == "bookclub-django").newTag)
            = env(IMAGE_TAG)
          ' k8s/applications/bookclub/overlays/production/kustomization.yaml

      - name: Commit GitOps image update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/applications/bookclub/overlays/production/kustomization.yaml

          git diff --cached --quiet && exit 0

          git commit -m "chore: deploy django ${IMAGE_TAG}"
          git push


  # --------------------------------------------------
  # Frontend deployment
  # --------------------------------------------------

  frontend-deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest

    needs:
      - frontend
      - changes

    if: |
      github.ref == 'refs/heads/main' &&
      (
        needs.changes.outputs.frontend == 'true' ||
        needs.changes.outputs.deployment == 'true' ||
        github.event_name == 'workflow_dispatch'
      )

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::796973519136:role/github-actions-bookclub
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload frontend
        run: |
          aws s3 sync \
            frontend/dist/ \
            s3://${{ secrets.S3_BUCKET_NAME }}/ \
            --delete

      - name: Invalidate frontend CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: bookclub-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_TAG: ${{ github.sha }}
  AWS_REGION: eu-west-3
  ECR_REPOSITORY: bookclub
  ECR_AI_REPOSITORY: bookclub-ai
  DJANGO_STATIC_BUCKET: sinan-bookclub-static
  VITE_API_URL: https://api.sinanerbezci.com/api

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./bookclub

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI dependencies
        run: |
          pip install -r requirements/django.txt

      - name: Check Django setup
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: mysite.settings.production
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          REDIS_URL: redis://localhost:6379/0
          CELERY_QUEUE_URL: dummy
        run: |
          python manage.py check

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

  changes:
    name: Detect Changes
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    outputs:
      backend: ${{ steps.filter.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
      frontend: ${{ steps.filter.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
      ai: ${{ steps.filter.outputs.ai == 'true' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show changed files
        if: github.event_name == 'push'
        run: |
          echo "Before: ${{ github.event.before }}"
          echo "After:  ${{ github.sha }}"
          echo

          git diff --name-status \
            "${{ github.event.before }}" \
            "${{ github.sha }}"

      - name: Detect changed paths
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'bookclub/ai/**'
              - 'bookclub/library/**'
              - 'bookclub/mysite/**'
              - 'bookclub/manage.py'
              - 'bookclub/Dockerfile'
              - 'bookclub/requirements/django.txt'
              - 'bookclub/.dockerignore'
              - '.github/workflows/ci.yml'

            ai:
              - 'bookclub/ai_service/**'
              - 'bookclub/requirements/ai.txt'
              - 'bookclub/Dockerfile.ai'
              - 'bookclub/.dockerignore'
              - '.github/workflows/ci.yml'

            frontend:
              - 'frontend/**'

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    needs:
      - backend
      - changes


    if: |
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch'
      ) &&
      (
        github.ref == 'refs/heads/main'
      ) &&
      needs.changes.outputs.backend == 'true'

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::796973519136:role/github-actions-bookclub
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Django image
        uses: docker/build-push-action@v6
        with:
          context: ./bookclub
          push: false
          load: true
          platforms: linux/amd64
          tags: bookclub:ci-backend
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Scan Django image with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: image
          image-ref: bookclub:ci-backend
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Tag and push Django image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag bookclub:ci-backend \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI dependencies
        working-directory: ./bookclub
        run: |
          pip install -r requirements/django.txt

      - name: Collect Django static files
        working-directory: ./bookclub
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: mysite.settings.production
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          REDIS_URL: redis://localhost:6379/0
          CELERY_QUEUE_URL: dummy
        run: |
          python manage.py collectstatic --noinput

      - name: Upload Django static files
        run: |
          aws s3 sync \
            bookclub/staticfiles/ \
            s3://${{ env.DJANGO_STATIC_BUCKET }}/ \
            --delete

  build-ai:
    name: Build AI workload
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
    needs:
      - changes

    if: |
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch'
      ) &&
      (
        github.ref == 'refs/heads/main'
      ) &&
      needs.changes.outputs.ai == 'true'

    steps:
    - name: Checkout application repository
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::796973519136:role/github-actions-bookclub
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3


    - name: Build AI image
      uses: docker/build-push-action@v6
      with:
        context: ./bookclub
        file: ./bookclub/Dockerfile.ai
        push: false
        load: true
        platforms: linux/amd64
        tags: bookclub:ci-ai
        cache-from: type=gha,scope=ai
        cache-to: type=gha,mode=max,scope=ai

    - name: Scan AI image with Trivy
      uses: aquasecurity/trivy-action@0.33.1
      with:
        scan-type: image
        image-ref: bookclub:ci-ai
        format: table
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        exit-code: '1'

    - name: Tag and push AI image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        docker tag bookclub:ci-ai \
          "$ECR_REGISTRY/$ECR_AI_REPOSITORY:$IMAGE_TAG"

        docker push \
          "$ECR_REGISTRY/$ECR_AI_REPOSITORY:$IMAGE_TAG"

  create-deployment-pr:
    name: Create Deployment PR
    runs-on: ubuntu-latest

    needs:
      - changes
      - build-backend
      - build-ai

    if: |
      always() &&
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch'
      ) &&
      (
        github.ref == 'refs/heads/main'
      ) &&
      needs.changes.result == 'success' &&
      (
        needs.changes.outputs.backend == 'true' ||
        needs.changes.outputs.ai == 'true'
      ) &&
      (
        needs.changes.outputs.backend != 'true' ||
        needs.build-backend.result == 'success'
      ) &&
      (
        needs.changes.outputs.ai != 'true' ||
        needs.build-ai.result == 'success'
      )

    steps:
      - name: Create deployment repository token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOOKCLUB_DEPLOYMENT_APP_ID }}
          private-key: ${{ secrets.BOOKCLUB_DEPLOYMENT_PRIVATE_KEY }}
          owner: SinanErbezci
          repositories: bookclub-deployment

      - name: Checkout deployment repository
        uses: actions/checkout@v4
        with:
          repository: SinanErbezci/bookclub-deployment
          token: ${{ steps.app-token.outputs.token }}
          path: deployment

      - name: Update image tags
        working-directory: ./deployment
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          AI_CHANGED: ${{ needs.changes.outputs.ai }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path(
              "k8s/applications/bookclub/overlays/production/kustomization.yaml"
          )

          text = path.read_text()

          if os.environ["BACKEND_CHANGED"] == "true":
              pattern = (
                  r"(- name: bookclub-django\s*"
                  r"newName: [^\n]+\s*"
                  r"newTag: )([^\n]+)"
              )

              text, count = re.subn(
                  pattern,
                  rf"\g<1>{os.environ['IMAGE_TAG']}",
                  text,
                  count=1,
              )

              if count != 1:
                  raise SystemExit(
                      "Could not find the bookclub-django image entry."
                  )

          if os.environ["AI_CHANGED"] == "true":
              pattern = (
                  r"(- name: bookclub-ai-service\s*"
                  r"newName: [^\n]+\s*"
                  r"newTag: )([^\n]+)"
              )

              text, count = re.subn(
                  pattern,
                  rf"\g<1>{os.environ['IMAGE_TAG']}",
                  text,
                  count=1,
              )

              if count != 1:
                  raise SystemExit(
                      "Could not find the bookclub-ai-service image entry."
                  )

          path.write_text(text)
          PY

          echo "Resulting image configuration:"
          grep -A3 "name: bookclub-django" \
            k8s/applications/bookclub/overlays/production/kustomization.yaml
          grep -A3 "name: bookclub-ai-service" \
            k8s/applications/bookclub/overlays/production/kustomization.yaml


      - name: Create deployment branch
        working-directory: ./deployment
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          set -euo pipefail

          git config user.name "BookClub Deployment Bot"
          git config user.email "bookclub-deployment-bot@users.noreply.github.com"

          BRANCH="deploy/${IMAGE_TAG}"
          FILE="k8s/applications/bookclub/overlays/production/kustomization.yaml"

          # Reuse the remote branch if this workflow is rerun.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "Deployment branch already exists: $BRANCH"
            git fetch origin "$BRANCH"
            git switch -c "$BRANCH" --track "origin/$BRANCH"
          else
            git switch -c "$BRANCH"
          fi

          git add "$FILE"

          if git diff --cached --quiet; then
            echo "No new image-tag changes to commit."
          else
            git commit -m "Deploy BookClub ${IMAGE_TAG}"
            git push origin "$BRANCH"
          fi

      
      - name: Create deployment PR
        working-directory: ./deployment
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          AI_CHANGED: ${{ needs.changes.outputs.ai }}
        run: |
          BRANCH="deploy/${IMAGE_TAG}"

          if [ "$BACKEND_CHANGED" = "true" ] && [ "$AI_CHANGED" = "true" ]; then
            TITLE="Deploy Django + AI ${IMAGE_TAG}"
            BODY="## Deployment

          Update Django and AI service images to:

          \`${IMAGE_TAG}\`

          Both images have already been built and pushed to Amazon ECR.

          After this PR is merged, Argo CD will reconcile the production environment.
          "
          elif [ "$BACKEND_CHANGED" = "true" ]; then
            TITLE="Deploy Django ${IMAGE_TAG}"
            BODY="## Deployment

          Update the Django image to:

          \`${IMAGE_TAG}\`

          The image has already been built and pushed to Amazon ECR.

          After this PR is merged, Argo CD will reconcile the production environment.
          "
          elif [ "$AI_CHANGED" = "true" ]; then
            TITLE="Deploy AI service ${IMAGE_TAG}"
            BODY="## Deployment

          Update the AI service image to:

          \`${IMAGE_TAG}\`

          The image has already been built and pushed to Amazon ECR.

          After this PR is merged, Argo CD will reconcile the production environment.
          "
          else
            TITLE="Deploy BookClub ${IMAGE_TAG}"
            BODY="## Deployment

          Update the BookClub application images to:

          \`${IMAGE_TAG}\`

          After this PR is merged, Argo CD will reconcile the production environment.
          "
          fi


          EXISTING_PR=$(gh pr list \
            --repo SinanErbezci/bookclub-deployment \
            --head "$BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$EXISTING_PR" ]; then
            echo "Deployment PR #${EXISTING_PR} already exists."
          else
            gh pr create \
              --repo SinanErbezci/bookclub-deployment \
              --base main \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body "$BODY"
          fi


  frontend-deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    needs:
      - frontend
      - changes

    if: |
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch'
      ) &&
      (
        github.ref == 'refs/heads/main'
      ) &&
      needs.changes.outputs.frontend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::796973519136:role/github-actions-bookclub
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload frontend
        run: |
          aws s3 sync \
            frontend/dist/ \
            s3://${{ secrets.S3_BUCKET_NAME }}/ \
            --delete

      - name: Invalidate frontend CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
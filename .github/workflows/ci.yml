name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: bookclub-main
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  IMAGE_TAG: ${{ github.sha }}
  AWS_REGION: eu-west-3
  ECR_REPOSITORY: bookclub
  ECS_CLUSTER: bookclub
  ECS_SERVICE: bookclub
  DJANGO_STATIC_BUCKET: sinan-bookclub-static

jobs:

  # --------------------------------------------------
  # Backend checks
  # --------------------------------------------------

  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./bookclub

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI dependencies
        run: |
          pip install -r requirements-ci.txt

      - name: Check Django setup
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: mysite.settings.production
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: |
          python manage.py check

  # --------------------------------------------------
  # Frontend checks
  # --------------------------------------------------

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

  # --------------------------------------------------
  # Deploy backend + static files
  # --------------------------------------------------

  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------------------------
      # AWS
      # ----------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::796973519136:role/github-actions-bookclub
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # ----------------------------------------------
      # Backend Docker image
      # ----------------------------------------------

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./bookclub
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      # ----------------------------------------------
      # nginx Docker image
      # ----------------------------------------------

      - name: Build and push nginx image
        uses: docker/build-push-action@v6
        with:
          context: ./bookclub
          file: ./bookclub/nginx/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:nginx
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:nginx-${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx
      # ----------------------------------------------
      # Django static files
      # ----------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI dependencies
        working-directory: ./bookclub
        run: |
          pip install -r requirements-ci.txt

      - name: Collect Django static files
        working-directory: ./bookclub
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: mysite.settings.production
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: |
          python manage.py collectstatic --noinput

      - name: Upload Django static files
        run: |
          aws s3 sync \
            bookclub/staticfiles/ \
            s3://${{ env.DJANGO_STATIC_BUCKET }}/ \
            --delete
      # ----------------------------------------------
      # Django database migrations
      # ----------------------------------------------

      - name: Run Django migrations
        run: |
          set -e

          echo "Getting network configuration from ECS service..."

          NETWORK_CONFIG=$(aws ecs describe-services \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.ECS_SERVICE }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'services[0].networkConfiguration' \
            --output json)

          echo "$NETWORK_CONFIG"

          echo "Starting migration task..."

          TASK_ARN=$(aws ecs run-task \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --task-definition bookclub \
            --launch-type FARGATE \
            --platform-version LATEST \
            --network-configuration "$NETWORK_CONFIG" \
            --overrides '{
              "containerOverrides": [
                {
                  "name": "web",
                  "image": "${{ steps.login-ecr.outputs.registry }}/bookclub:'"${IMAGE_TAG}"'",
                  "command": [
                    "python",
                    "manage.py",
                    "migrate",
                    "--noinput"
                  ]
                }
              ]
            }' \
            --region "${{ env.AWS_REGION }}" \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Migration task: $TASK_ARN"

          aws ecs wait tasks-stopped \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --tasks "$TASK_ARN" \
            --region "${{ env.AWS_REGION }}"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --tasks "$TASK_ARN" \
            --region "${{ env.AWS_REGION }}" \
            --query 'tasks[0].containers[?name==`web`].exitCode | [0]' \
            --output text)

          echo "Migration exit code: $EXIT_CODE"

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Database migration failed."
            exit 1
          fi

          echo "Database migration completed successfully."

      # ----------------------------------------------
      # ECS deployment
      # ----------------------------------------------

      - name: Force ECS deployment
        run: |
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.ECS_SERVICE }}" \
            --force-new-deployment \
            --region "${{ env.AWS_REGION }}"

      - name: Wait for ECS deployment
        run: |
          aws ecs wait services-stable \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.ECS_SERVICE }}" \
            --region "${{ env.AWS_REGION }}"

      - name: Check ECS service
        run: |
          aws ecs describe-services \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.ECS_SERVICE }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'services[0].{Status:status,Desired:desiredCount,Running:runningCount,Pending:pendingCount}'

  # --------------------------------------------------
  # Frontend deployment
  # --------------------------------------------------

  frontend-deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest

    needs:
      - frontend

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::796973519136:role/github-actions-bookclub
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload frontend
        run: |
          aws s3 sync \
            frontend/dist/ \
            s3://${{ secrets.S3_BUCKET_NAME }}/ \
            --delete

      - name: Invalidate frontend CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: bookclub-main
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  IMAGE_TAG: ${{ github.sha }}
  AWS_REGION: eu-west-3
  ECR_REPOSITORY: bookclub
  DJANGO_STATIC_BUCKET: sinan-bookclub-static
  VITE_API_URL: https://api.sinanerbezci.com/api

jobs:

  # --------------------------------------------------
  # Backend checks
  # --------------------------------------------------

  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./bookclub

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI dependencies
        run: |
          pip install -r requirements-ci.txt

      - name: Check Django setup
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: mysite.settings.production
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: |
          python manage.py check


  # --------------------------------------------------
  # Frontend checks
  # --------------------------------------------------

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build frontend
        run: npm run build


  # --------------------------------------------------
  # Detect changed parts of the application
  # --------------------------------------------------

  changes:
    name: Detect Changes
    runs-on: ubuntu-latest

    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'bookclub/**'

            frontend:
              - 'frontend/**'


  # --------------------------------------------------
  # Build and push Django image + create deployment PR
  # --------------------------------------------------

  deploy-backend:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest

    needs:
      - backend
      - changes

    if: |
      github.ref == 'refs/heads/main' &&
      (
        needs.changes.outputs.backend == 'true' ||
        github.event_name == 'workflow_dispatch'
      )

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      # ----------------------------------------------
      # AWS authentication
      # ----------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::796973519136:role/github-actions-bookclub
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------
      # ECR
      # ----------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------------------------
      # Build Django image
      # ----------------------------------------------

      - name: Build and push Django image
        uses: docker/build-push-action@v6
        with:
          context: ./bookclub
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # ----------------------------------------------
      # Django static files
      # ----------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI dependencies
        working-directory: ./bookclub
        run: |
          pip install -r requirements-ci.txt

      - name: Collect Django static files
        working-directory: ./bookclub
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: mysite.settings.production
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: |
          python manage.py collectstatic --noinput

      - name: Upload Django static files
        run: |
          aws s3 sync \
            bookclub/staticfiles/ \
            s3://${{ env.DJANGO_STATIC_BUCKET }}/ \
            --delete

      # ----------------------------------------------
      # GitHub App authentication
      # ----------------------------------------------

      - name: Create deployment repository token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOOKCLUB_DEPLOYMENT_APP_ID }}
          private-key: ${{ secrets.BOOKCLUB_DEPLOYMENT_PRIVATE_KEY }}
          owner: SinanErbezci
          repositories: bookclub-deployment

      # ----------------------------------------------
      # Checkout GitOps repository
      # ----------------------------------------------

      - name: Checkout deployment repository
        uses: actions/checkout@v4
        with:
          repository: SinanErbezci/bookclub-deployment
          token: ${{ steps.app-token.outputs.token }}
          path: deployment

      # ----------------------------------------------
      # Update Kubernetes image tag
      # ----------------------------------------------

      - name: Update Django image tag
        working-directory: ./deployment
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path(
              "k8s/applications/bookclub/overlays/production/kustomization.yaml"
          )

          text = path.read_text()

          pattern = (
              r"(images:\s*"
              r"- name: bookclub-django\s*"
              r"newName: [^\n]+\s*"
              r"newTag: )([^\n]+)"
          )

          updated, count = re.subn(
              pattern,
              rf"\g<1>{os.environ['IMAGE_TAG']}",
              text,
              count=1,
          )

          if count != 1:
              raise SystemExit(
                  "Could not find the bookclub-django image entry."
              )

          path.write_text(updated)
          PY

          echo "Updated image tag:"
          grep -A3 "name: bookclub-django" \
            k8s/applications/bookclub/overlays/production/kustomization.yaml

      # ----------------------------------------------
      # Create deployment branch
      # ----------------------------------------------

      - name: Create deployment branch
        working-directory: ./deployment
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          git config user.name "BookClub Deployment Bot"
          git config user.email "bookclub-deployment-bot@users.noreply.github.com"

          BRANCH="deploy/django-${IMAGE_TAG}"

          git checkout -b "$BRANCH"

          git add k8s/applications/bookclub/overlays/production/kustomization.yaml

          git commit \
            -m "Deploy Django ${IMAGE_TAG}"

          git push origin "$BRANCH"

      # ----------------------------------------------
      # Create deployment PR
      # ----------------------------------------------

      - name: Create deployment PR
        working-directory: ./deployment
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          BRANCH="deploy/django-${IMAGE_TAG}"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Deploy Django ${IMAGE_TAG}" \
            --body "## Deployment

          Update the Django image to:

          \`${IMAGE_TAG}\`

          The image has already been built and pushed to Amazon ECR.

          After this PR is merged, Argo CD will reconcile the production environment.
          "


  # --------------------------------------------------
  # Frontend deployment
  # --------------------------------------------------

  frontend-deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest

    needs:
      - frontend
      - changes

    if: |
      github.ref == 'refs/heads/main' &&
      (
        needs.changes.outputs.frontend == 'true' ||
        github.event_name == 'workflow_dispatch'
      )

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::796973519136:role/github-actions-bookclub
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload frontend
        run: |
          aws s3 sync \
            frontend/dist/ \
            s3://${{ secrets.S3_BUCKET_NAME }}/ \
            --delete

      - name: Invalidate frontend CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
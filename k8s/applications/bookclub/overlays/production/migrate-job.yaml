apiVersion: batch/v1
kind: Job
metadata:
  name: django-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: migrate
        image: bookclub-django
        command: ["python",  "manage.py", "migrate"]
        envFrom:
          - configMapRef:
              name: django-config
          - secretRef:
              name: django-secrets


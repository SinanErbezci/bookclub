apiVersion: batch/v1
kind: Job
metadata:
  name: django-migrate
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: bookclub-django
          command: ["python", "manage.py", "migrate"]
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: mysite.settings.production
          envFrom:
            - configMapRef:
                name: django-config
            - secretRef:
                name: django-secrets


apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: external-dns-cloudflare
  namespace: external-dns
  annotations:
    argocd.argoproj.io/sync-wave: "-1"

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore

  target:
    name: external-dns-cloudflare
    creationPolicy: Owner

  data:
    - secretKey: api-token
      remoteRef:
        key: /bookclub/production/CLOUDFLARE_API_TOKEN
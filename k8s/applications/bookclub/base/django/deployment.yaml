apiVersion: apps/v1
kind: Deployment
metadata:
  name: django
  labels:
    app: django
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: django
  template:
    metadata:
      labels:
        app: django
    spec:
      containers:
      - name: django
        image: bookclub-django
        ports:
          - containerPort: 8000
        envFrom:
          - configMapRef:
              name: django-config
          - secretRef:
              name: django-secrets
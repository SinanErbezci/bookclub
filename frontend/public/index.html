<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>BookClub | Goodreads-Inspired Full-Stack Book Platform</title>

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta
      name="description"
      content="Discover books, explore authors and genres, create personalized reading lists, and share reviews with BookClub, a production-ready full-stack web application."
    />

    <meta name="author" content="Sinan Erbezci" />

    <!-- Favicon -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

    <!-- PNG icons -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%PUBLIC_URL%/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="%PUBLIC_URL%/favicon-16x16.png"
    />

    <!-- Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Theme -->
    <meta name="theme-color" content="#D4AF37" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BookClub" />
    <meta
      property="og:title"
      content="BookClub | Goodreads-Inspired Full-Stack Book Platform"
    />
    <meta
      property="og:description"
      content="A production-ready full-stack book platform built with Django, React, PostgreSQL, Docker, Terraform, and AWS."
    />
    <meta
      property="og:url"
      content="https://bookclub.sinanerbezci.com"
    />
    <meta
      property="og:image"
      content="https://bookclub.sinanerbezci.com/og-image.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="BookClub homepage preview"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="BookClub | Goodreads-Inspired Full-Stack Book Platform"
    />
    <meta
      name="twitter:description"
      content="A production-ready full-stack book platform built with Django, React, PostgreSQL, Docker, Terraform, and AWS."
    />
    <meta
      name="twitter:image"
      content="https://bookclub.sinanerbezci.com/og-image.jpg"
    />
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
